<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#050607" />
  <title>MISPLACED — Offline Prototype 0.1.1</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <canvas id="game" width="640" height="360" aria-label="MISPLACED"></canvas>

    <div id="scanlines"></div>
    <div id="vignette"></div>

    <section id="menu" class="panel visible">
      <div class="brand">
        <span class="eyebrow">OFFLINE PROTOTYPE / ALPHA 0.1.1</span>
        <h1>MISPLACED</h1>
        <p>Blackridge Facility</p>
      </div>

      <div class="role-grid">
        <button class="role-card" data-role="survivor">
          <span class="role-icon survivor-icon"></span>
          <strong>SOBREVIVENTE</strong>
          <small>Você + 3 bots contra The Misplaced</small>
        </button>

        <button class="role-card monster" data-role="monster">
          <span class="role-icon monster-icon"></span>
          <strong>MONSTRO</strong>
          <small>Você caça 4 sobreviventes controlados pela IA</small>
        </button>
      </div>

      <div class="menu-note">
        <b>Objetivo deste build:</b> testar escala, câmera, colisão, portas, IA e visão bloqueada por cômodos.
      </div>
    </section>

    <div id="hud" class="hidden">
      <div class="hud-top">
        <div>
          <span id="roleLabel">SURVIVOR</span>
          <b id="zoneLabel">CORREDOR CENTRAL</b>
        </div>
        <button id="menuBtn" title="Voltar ao menu">☰</button>
      </div>

      <div id="objective">EXPLORE BLACKRIDGE</div>

      <div id="staminaWrap">
        <span>STAMINA</span>
        <div id="staminaBar"><i></i></div>
      </div>

      <div id="hint"></div>
    </div>

    <div id="mobileControls" class="hidden">
      <div id="joystick" class="joystick">
        <div class="stick"></div>
      </div>
      <button id="actionBtn" class="touch-btn action">E</button>
      <button id="sprintBtn" class="touch-btn sprint">RUN</button>
    </div>

    <div id="toast"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
